<section id="dashboards-view">

    <h2 class="mb-4" style="font-size: 2.5rem;">Interactive Business Dashboards</h2>
    
    <div class="dashboard-switcher" id="dash-switcher">
      <!-- Buttons populated here -->
    </div>
    
    <div class="grid-2" style="align-items: start;">
      <div class="dashboard-context insight-card">
        <h3 id="dash-title" class="mb-2">Select a Dashboard</h3>
        <p class="text-grey mb-1"><strong>Use Case:</strong> <span id="dash-usecase">...</span></p>
        <p class="text-grey"><strong>Key Insight:</strong> <span id="dash-insight">...</span></p>
      </div>
      <div>
        <div class="dashboard-frame-container" id="dash-frame-container">
          <iframe id="dash-iframe" class="dashboard-frame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>
    </div>
  </div>
</section>
