<section class="page-section fade-in">
  <div class="container grid grid-cols-3">
    
    <!-- Sidebar -->
    <div style="display: flex; flex-direction: column; gap: 1rem;">
      <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Analytics Lab</h2>
      <p class="text-grey text-small mb-2">Raw dataset previews used in the portfolio case studies.</p>
      
      <div id="lab-nav" style="display: flex; flex-direction: column; gap: 0.5rem;">
        <button class="btn btn-secondary dataset-btn active" data-file="flights.csv" style="justify-content: flex-start; text-align: left; border-color: var(--prof-blue);">Aviation Pricing</button>
        <button class="btn btn-secondary dataset-btn" data-file="ecommerce.csv" style="justify-content: flex-start; text-align: left;">E-Commerce Sales</button>
        <button class="btn btn-secondary dataset-btn" data-file="gym-performance.csv" style="justify-content: flex-start; text-align: left;">Gym Performance</button>
        <button class="btn btn-secondary dataset-btn" data-file="ai-productivity.csv" style="justify-content: flex-start; text-align: left;">AI Productivity</button>
      </div>
    </div>

    <!-- Main Content -->
    <div style="grid-column: span 2;" class="card">
      <div class="flex justify-between items-center mb-3">
        <h3 id="dataset-title">Dataset Preview</h3>
        <div class="badge">Top 20 Rows</div>
      </div>
      
      <div class="form-group mb-3" style="max-width: 300px;">
        <input type="text" id="dataset-filter" class="form-control" placeholder="Filter rows...">
      </div>
      
      <div class="data-table-wrapper">
        <table class="data-table" id="dataset-table">
          <thead>
            <tr id="table-head">
              <!-- Injected by JS -->
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Injected by JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>
</section>
