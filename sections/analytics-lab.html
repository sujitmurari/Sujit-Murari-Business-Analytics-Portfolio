<section id="analytics-lab">
  <div class="container">
    <h2 class="mb-2" style="font-size: 2.5rem;">Analytics Lab</h2>
    <p class="text-grey mb-4">A simplified view into the dataset exploration phase. Filter the dummy logistics dataset below.</p>
    
    <div class="insight-card">
      <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
        <input type="text" id="lab-search" placeholder="Search Status..." style="padding: 0.5rem; border-radius: 4px; border: 1px solid rgba(148,163,184,0.3); background: rgba(255,255,255,0.05); color: white; width: 250px;">
        <button id="lab-filter-btn" class="btn-primary" style="padding: 0.5rem 1rem;">Filter</button>
      </div>
      
      <div style="overflow-x: auto;">
        <table class="data-table" id="lab-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Vendor Type</th>
              <th>Delivery Time (mins)</th>
              <th>Status</th>
              <th>Is Tracked</th>
            </tr>
          </thead>
          <tbody id="lab-table-body">
            <!-- Simulated rows via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</section>
