<!-- ═══════════════════════════════════════════════
     FAVICON & PWA — paste inside <head> of every page
     Replace the two existing favicon lines with this block
     ═══════════════════════════════════════════════ -->

  <!-- Standard favicons -->
  <link rel="icon" type="image/x-icon"       href="favicon.ico"/>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" sizes="16x16"  href="favicon-16x16.png"/>
  <link rel="icon" type="image/png" sizes="32x32"  href="favicon-32x32.png"/>

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>

  <!-- Android / PWA -->
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png"/>

  <!-- Web App Manifest -->
  <link rel="manifest" href="site.webmanifest"/>

  <!-- Theme color (browser chrome on mobile) -->
  <meta name="theme-color" content="#050510"/>
  <meta name="msapplication-TileColor" content="#050510"/>
  <meta name="msapplication-TileImage" content="android-chrome-192x192.png"/>

  <!-- Open Graph (social share preview) -->
  <meta property="og:image"       content="android-chrome-512x512.png"/>
  <meta property="og:image:width"  content="512"/>
  <meta property="og:image:height" content="512"/>
