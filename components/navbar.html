<header style="border-bottom: 1px solid var(--border-subtle); background-color: rgba(10, 10, 10, 0.95); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 100;">
  <div class="container py-3">
    <div class="flex justify-between items-center" style="height: 60px;">
      
      <!-- Brand -->
      <a href="#about" class="text-white" style="font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; z-index: 101; font-family: monospace; letter-spacing: 0.05em;">
        <span style="color: var(--prof-blue);">&gt;_</span> SUJIT MURARI
      </a>

      <!-- Desktop Nav -->
      <nav id="main-nav" class="nav-menu">
        <ul class="flex gap-2 nav-list">
          <li><a href="#about" class="nav-link" style="font-weight: 600; font-size: 0.85rem; text-transform: uppercase;">About Me</a></li>
          <li><a href="#projects" class="nav-link" style="font-weight: 600; font-size: 0.85rem; text-transform: uppercase;">Projects</a></li>
          <li><a href="#case-studies" class="nav-link" style="font-weight: 600; font-size: 0.85rem; text-transform: uppercase;">Case Studies</a></li>
          <li><a href="#dashboards" class="nav-link" style="font-weight: 600; font-size: 0.85rem; text-transform: uppercase;">Dashboards</a></li>
          <li><a href="#analytics-lab" class="nav-link" style="font-weight: 600; font-size: 0.85rem; text-transform: uppercase;">CSV / Datasets</a></li>
          <li><a href="#contact" class="nav-link cta" style="font-weight: 600; font-size: 0.85rem; text-transform: uppercase; border: 1px solid var(--prof-blue); padding: 0.25rem 0.75rem; color: var(--prof-blue);">Contact</a></li>
        </ul>
      </nav>
      
      <!-- Mobile Menu Button -->
      <button id="mobile-menu-btn" class="mobile-toggle" aria-label="Toggle Menu" style="background: none; border: none; color: var(--white-text); cursor: pointer; z-index: 101; display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--prof-blue)" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

    </div>
  </div>
</header>

<script>
  // Simple script for mobile nav toggle
  (function() {
    const btn = document.getElementById('mobile-menu-btn');
    const nav = document.getElementById('main-nav');
    if(btn && nav) {
      btn.addEventListener('click', () => {
        nav.classList.toggle('nav-open');
      });
      // Close nav when clicking a link
      nav.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
          nav.classList.remove('nav-open');
        });
      });
    }
  })();
</script>
