<header style="border-bottom: 1px solid var(--border-subtle); background-color: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 100;">
  <div class="container py-3">
    <div class="flex justify-between items-center" style="height: 60px;">
      
      <!-- Brand -->
      <a href="#about" class="text-white" style="font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; z-index: 101;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--prof-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
        Sujit Murari
      </a>

      <!-- Desktop Nav -->
      <nav id="main-nav" class="nav-menu">
        <ul class="flex gap-2 nav-list">
          <li><a href="#about" class="nav-link" style="font-weight: 500; font-size: 0.875rem;">Executive Overview</a></li>
          <li><a href="#projects" class="nav-link" style="font-weight: 500; font-size: 0.875rem;">Projects</a></li>
          <li><a href="#case-studies" class="nav-link" style="font-weight: 500; font-size: 0.875rem;">Case Studies</a></li>
          <li><a href="#dashboards" class="nav-link" style="font-weight: 500; font-size: 0.875rem;">Dashboards</a></li>
          <li><a href="#analytics-lab" class="nav-link" style="font-weight: 500; font-size: 0.875rem;">Analytics Lab</a></li>
          <li><a href="#contact" class="nav-link cta" style="font-weight: 500; font-size: 0.875rem; border: 1px solid var(--border-subtle); padding: 0.25rem 0.75rem; border-radius: 4px;">Contact</a></li>
        </ul>
      </nav>
      
      <!-- Mobile Menu Button -->
      <button id="mobile-menu-btn" class="mobile-toggle" aria-label="Toggle Menu" style="background: none; border: none; color: var(--white-text); cursor: pointer; z-index: 101; display: none;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

    </div>
  </div>
</header>

<script>
  // Simple script for mobile nav toggle
  (function() {
    const btn = document.getElementById('mobile-menu-btn');
    const nav = document.getElementById('main-nav');
    if(btn && nav) {
      btn.addEventListener('click', () => {
        nav.classList.toggle('nav-open');
      });
      // Close nav when clicking a link
      nav.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
          nav.classList.remove('nav-open');
        });
      });
    }
  })();
</script>
